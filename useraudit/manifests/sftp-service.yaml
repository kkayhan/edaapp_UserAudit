apiVersion: v1
kind: Service
metadata:
  name: eda-useraudit-sftp
  namespace: eda-system
  annotations:
    # Colocate on the MetalLB VIP already shared by eda-api / eda-aggregated.
    # Harmless when the service type is switched to NodePort at install time.
    metallb.universe.tf/allow-shared-ip: eda-shared-vip
spec:
  type: LoadBalancer # app-set: ${sftpServiceType}
  selector:
    eda.nokia.com/app: eda-useraudit
  ports:
    - name: sftp
      port: 22522 # app-set: ${sftpPort}
      targetPort: sftp
      protocol: TCP
